<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShiftDesk — synthetic TRAIN-only GUI</title>
<style>
*{box-sizing:border-box}
html,body{width:960px;height:720px;margin:0;overflow:hidden}
body{font:15px Arial,Tahoma,sans-serif;background:#eef3f9;color:#1c3046}
body.dark{background:#19273b;color:#ecf4ff}
header{height:106px;padding:24px 36px;background:#233d61;color:#fff;display:flex;align-items:center;justify-content:space-between}
body.dark header{background:#0a1424}
.brand{font-size:29px;font-weight:800;letter-spacing:.5px}
.sub{font-size:12px;margin-top:5px;opacity:.82}
.chip{background:#ffffff21;border:1px solid #ffffff60;border-radius:10px;padding:11px 13px;font-weight:bold}
main{padding:19px 32px 16px}
h1{margin:0 0 17px;font-size:23px;font-weight:800}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,230px);gap:15px}
.card{position:relative;min-width:0;padding:16px;border:2px solid #cbd8e7;border-radius:14px;background:#fff;box-shadow:0 3px 7px #1a315014}
body.dark .card{background:#2a3c55;border-color:#4b6584}
.card .id{direction:ltr;text-align:start;unicode-bidi:isolate;font-size:23px;font-weight:900}
.card .type{font-size:14px;font-weight:650;margin-top:19px;min-height:38px;color:#395675}
body.dark .card .type{color:#c7daea}
.card .state{font-size:12px;margin-bottom:12px;opacity:.8}
.card button{border:0;border-radius:9px;background:#167b79;color:white;padding:10px 12px;min-width:102px;font-size:14px;font-weight:800;cursor:pointer}
.card button:disabled{background:#a3b3c5;color:#25354c;cursor:default}
body.dark .card button{background:#57b8b0;color:#0a1e29}
body.dark .card button:disabled{background:#697d92;color:#fff}
body.compact .card{padding:22px 15px}
body.compact .card .type{margin-top:8px;min-height:49px}
body.compact .card button{width:100%}
footer{text-align:center;padding-top:17px;font-size:12px;opacity:.7;direction:ltr}
</style>
</head>
<body>
<header><div><div class="brand">ShiftDesk</div><div id="subtitle" class="sub">Author-owned fictional workflow research</div></div><div id="counter" class="chip">Processed: 0</div></header>
<main><h1 id="heading">Choose a fictional queue item</h1><section id="cards" class="cards"></section><footer>HALA H285 · ORIGINAL SOURCE · TRAIN-CANDIDATE ONLY · NO USER DATA</footer></main>
<script>
"use strict";
const IDS=["S-401","S-415","S-428","S-439","S-452","S-467","S-480","S-493"];
const TYPE_EN=["Maintenance","Review","Delivery","Inspection","Dispatch","Inventory","Packing","Routing"];
const TYPE_AR=["صيانة","مراجعة","توصيل","فحص","إرسال","جرد","تغليف","توجيه"];
const ORDERS=[
  [0,1,2,3,4,5,6,7],
  [3,0,5,2,7,4,1,6],
  [6,4,2,0,7,5,3,1]
];
const state=IDS.map(id=>({id,done:false}));
let settings={lang:"en",layout:0,theme:"light",density:"standard"};
function configureShiftDesk(input){
  if(!input || !["en","ar"].includes(input.lang) ||
      !Number.isInteger(input.layout) || ![0,1,2].includes(input.layout) ||
      !["light","dark"].includes(input.theme) ||
      !["standard","compact"].includes(input.density)) throw Error("invalid synthetic TRAIN scene");
  if(state.some(x=>x.done)) throw Error("configuration only before a source action");
  settings={lang:input.lang,layout:input.layout,theme:input.theme,density:input.density};
  render();
}
function render(){
  const ar=settings.lang==="ar";
  document.documentElement.lang=ar?"ar":"en";
  document.documentElement.dir=ar?"rtl":"ltr";
  document.body.className=(settings.theme==="dark"?"dark ":"")+settings.density;
  document.getElementById("subtitle").textContent=ar?"لوحة مهام خيالية دون بيانات عملاء":"Author-owned fictional workflow research";
  document.getElementById("heading").textContent=ar?"اختر بطاقة المهمة الخيالية":"Choose a fictional queue item";
  document.getElementById("counter").textContent=(ar?"تم الإنجاز: ":"Processed: ")+state.filter(x=>x.done).length;
  const host=document.getElementById("cards");host.replaceChildren();
  ORDERS[settings.layout].forEach(index=>{
    const item=state[index];
    const card=document.createElement("article");card.className="card";card.dataset.itemId=item.id;
    const id=document.createElement("div");id.className="id";id.textContent=item.id;
    const type=document.createElement("div");type.className="type";type.textContent=(ar?TYPE_AR:TYPE_EN)[index];
    const status=document.createElement("div");status.className="state";status.textContent=ar?(item.done?"مكتملة":"بانتظار التنفيذ"):(item.done?"Completed":"Not completed");
    const action=document.createElement("button");action.type="button";action.className="complete";
    action.textContent=item.done?(ar?"مكتملة":"Done"):(ar?"إنجاز":"Complete");
    action.disabled=item.done;
    action.addEventListener("click",()=>{if(!item.done){item.done=true;render();}});
    card.append(id,type,status,action);host.append(card);
  });
}
Object.defineProperty(window,"shiftDeskState",{value:()=>state.map(x=>({id:x.id,done:x.done})),writable:false});
Object.defineProperty(window,"configureShiftDesk",{value:configureShiftDesk,writable:false});
render();
</script>
</body>
</html>
