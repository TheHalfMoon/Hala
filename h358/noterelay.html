<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NoteRelay — Original Multi-step GUI Research Candidate</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font:17px Arial,sans-serif;color:var(--ink);background:var(--outside)}
body.light{--outside:#edf1f6;--panel:#fff;--ink:#172534;--border:#c6d0dc;--muted:#617185;--button:#164b83;--inverse:#fff}
body.dark{--outside:#141e2c;--panel:#253348;--ink:#f5f7fc;--border:#546781;--muted:#bac8db;--button:#79acd7;--inverse:#102236}
main{margin:38px auto;width:850px;height:641px;padding:31px 37px;background:var(--panel);border:2px solid var(--border);border-radius:16px}
h1{font-size:29px;margin:0}
.subtitle{font-size:16px;color:var(--muted);margin:11px 0 22px}
.workspace{border:2px solid var(--border);border-radius:14px;padding:21px 24px;min-height:390px}
.workspace h2{font-size:21px;margin:0 0 17px}
button{background:var(--button);color:var(--inverse);border:0;border-radius:9px;cursor:pointer;font:700 18px Arial,sans-serif;min-width:174px;height:54px}
button:focus-visible{outline:3px solid #f3a71b;outline-offset:4px}
#editor[hidden],#open[hidden]{display:none}
label{display:block;font-size:17px;font-weight:bold;margin:16px 0 12px}
input{font:22px Arial,sans-serif;width:420px;height:58px;background:var(--panel);color:var(--ink);border:2px solid var(--border);border-radius:8px;padding:10px 16px;direction:ltr}
#save{display:block;margin-top:25px}
.status{border-top:1px solid var(--border);margin-top:25px;padding-top:17px;font-size:16px;color:var(--muted)}
</style>
</head>
<body class="light">
<main>
<h1 id="title">NoteRelay</h1>
<p class="subtitle" id="subtitle">Original synthetic workflow</p>
<div class="workspace">
<h2 id="workspace">Workspace 01</h2>
<button id="open" type="button">New note</button>
<div id="editor" hidden>
<label id="input-label" for="code">Code</label>
<input id="code" type="text" autocomplete="off" spellcheck="false" maxlength="12">
<button id="save" type="button">Save note</button>
</div>
<div class="status" id="status" role="status">Ready</div>
</div>
</main>
<script>
"use strict";
// No external scripts, DOM gold overlays, secret data or network access.
const get=(id)=>document.getElementById(id);
let stage="start";
let expected="";
let committed=null;
const W={
  en:{title:"NoteRelay",subtitle:"Original synthetic workflow",
      workspace:"Workspace ",open:"New note",code:"Reference code",
      save:"Save note",ready:"Ready",edit:"Enter the reference code",
      focused:"Field focused",typed:"Code entered",saved:"Saved"},
  ar:{title:"ترحيل الملاحظات",subtitle:"سير عمل اصطناعي أصلي",
      workspace:"مساحة العمل ",open:"ملاحظة جديدة",code:"الرمز المرجعي",
      save:"حفظ الملاحظة",ready:"جاهز",edit:"أدخل الرمز المرجعي",
      focused:"تم تحديد الحقل",typed:"تم إدخال الرمز",saved:"تم الحفظ"}
};
window.configureOriginalScene=function(spec){
  if(!spec||typeof spec!=="object"||Object.keys(spec).sort().join(",")!=="code,language,theme,workspace")throw Error("invalid source");
  if(!/^[A-Z][0-9]{4}$/.test(spec.code)||!["en","ar"].includes(spec.language)||!["light","dark"].includes(spec.theme)||!Number.isInteger(spec.workspace)||spec.workspace<1||spec.workspace>99)throw Error("invalid scene");
  expected=spec.code;committed=null;stage="start";
  const t=W[spec.language];document.documentElement.lang=spec.language;
  document.documentElement.dir=spec.language==="ar"?"rtl":"ltr";
  document.body.className=spec.theme;
  get("title").textContent=t.title;get("subtitle").textContent=t.subtitle;
  get("workspace").textContent=t.workspace+String(spec.workspace).padStart(2,"0");
  get("open").textContent=t.open;get("input-label").textContent=t.code;
  get("save").textContent=t.save;get("status").textContent=t.ready;
  get("open").hidden=false;get("editor").hidden=true;get("code").value="";
  if(document.activeElement&&typeof document.activeElement.blur==="function")document.activeElement.blur();
};
get("open").addEventListener("click",()=>{
  if(stage!=="start")return;
  stage="open";get("open").hidden=true;get("editor").hidden=false;
  get("status").textContent=W[document.documentElement.lang].edit;
});
get("code").addEventListener("focus",()=>{
  if(stage==="open"){stage="focused";get("status").textContent=W[document.documentElement.lang].focused;}
});
get("code").addEventListener("input",()=>{
  if(stage==="focused"||stage==="typed"){
    stage="typed";get("status").textContent=W[document.documentElement.lang].typed;
  }
});
get("save").addEventListener("click",()=>{
  if(stage!=="typed")return;
  if(get("code").value!==expected)return;
  stage="saved";committed=expected;
  get("status").textContent=W[document.documentElement.lang].saved;
});
window.getOriginalState=()=>({stage,committed,focused:document.activeElement===get("code")});
</script>
</body>
</html>
