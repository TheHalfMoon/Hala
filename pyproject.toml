[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hala-engine"
version = "0.1.0"
description = "Bounded intelligence proposals and independent synthetic qualification for Aladdin"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["Pillow==12.3.0"]

[tool.setuptools.packages.find]
include = ["hala*", "evaluation*", "training*", "data*"]

[tool.ruff]
target-version = "py311"
line-length = 100
