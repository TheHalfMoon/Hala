# H211: offline synthetic GUI scene/strict action rubric tests only.
# Real 256M public inference is owner-operated and is not run by CI.
name: H211 synthetic visual click grounding scoring safeguards

on:
  push:
    branches:
      - ps/h211-real-pretrained-gui-click-baseline
    paths:
      - ".github/workflows/h211-public-gui-rubric-cpu.yml"
      - "h211/**"
      - "tests/test_h211_public_gui_grounding_baseline.py"
  pull_request:
    paths:
      - ".github/workflows/h211-public-gui-rubric-cpu.yml"
      - "h211/**"
      - "tests/test_h211_public_gui_grounding_baseline.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h211-public-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-cpu:
    name: Python ${{ matrix.python-version }} synthetic GUI scoring rubric
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      HF_HUB_OFFLINE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Pillow for original self-generated GUI pixels
        run: python -m pip install --disable-pip-version-check Pillow==12.3.0
      - name: Negative controls without model downloads or owner data
        shell: bash
        run: |
          set -euo pipefail
          for mode in normal optimized; do
            args=()
            if [ "$mode" = optimized ]; then args=(-O); fi
            python "${args[@]}" -m unittest discover -s tests -p 'test_h211_public_gui_grounding_baseline.py' -q
            python "${args[@]}" -m unittest discover -s tests -p 'test_h209_public_cpu_visual_baseline.py' -q
          done
          python -m compileall -q h209 h211 tests/test_h211_public_gui_grounding_baseline.py
          echo "H211_PUBLIC_SYNTHETIC_GUI_SCORE_RUBRIC_PASS_NO_WEIGHTS_NO_OWNER_MEDIA"
