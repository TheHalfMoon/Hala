name: h276-original-queueboard-browser
on:
  push:
    branches:
      - ps/h276-queueboard-native-browser-qualification
  pull_request:
    paths:
      - 'h275/queueboard.html'
      - 'h276/**'
      - 'tests/test_h276_queueboard_browser.py'
      - '.github/workflows/h276-queueboard-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h276-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firstparty-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HALA_H276_BROWSER_QUALIFY: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.14'
      - name: Install bounded public browser test dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0 Pillow==12.3.0
          python -m playwright install --with-deps chromium
      - name: Run live original first-party browser qualification
        run: python -m unittest discover -s tests -p 'test_h276_queueboard_browser.py' -v

  firstparty-edge:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      HALA_H276_BROWSER_QUALIFY: '1'
      HALA_H276_BROWSER_CHANNEL: 'msedge'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned browser Python dependencies
        run: python -m pip install --disable-pip-version-check playwright==1.64.1 Pillow==12.3.0
      - name: Run live machine-installed Microsoft Edge qualification
        run: python -m unittest discover -s tests -p 'test_h276_queueboard_browser.py' -v
