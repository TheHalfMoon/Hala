name: H361 original native Qwen processor interface (SOURCE only, no model)

on:
  pull_request:
    paths:
      - h361/**
      - tests/test_h361_original_qwen_processor.py
      - .github/workflows/h361-original-processor-source-interface.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-screens-and-simulated-processor-interface-only:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - name: Preserve exact original source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Source-image dependencies only (NOT Qwen)
        run: python -m pip install playwright==1.64.1 Pillow==11.3.0
      - name: Install real original source Chromium on Ubuntu
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Require original browser and PNG checks
        run: python -c "from playwright.sync_api import sync_playwright; from PIL import Image; assert callable(sync_playwright) and Image is not None"
      - name: Audit real original browser images with simulated processor interface
        env:
          HALA_H361_BROWSER_QA: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest tests.test_h361_original_qwen_processor tests.test_h359_native_candidate_bridge tests.test_h199_native_action_sft -q
      - name: Assert candidate PNGs and labels never persisted
        run: python -c "import subprocess; assert not subprocess.check_output(['git', 'status', '--porcelain'], text=True), 'unexpected source labels/media in Git checkout'"
