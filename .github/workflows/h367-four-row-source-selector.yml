name: H367 source-only four-row CPU pack contract (NO TRAIN)

on:
  pull_request:
    paths:
      - h367/**
      - tests/test_h367_four_row_preflight.py
      - tests/test_h368_pad_integrity.py
      - h364/native_batch.py
      - h364/run_real_cpu_batch.py
      - .github/workflows/h367-four-row-source-selector.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-only-multilingual-four-row:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - name: Preserve original source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Verify source-selector, action masks and int64 overflow refusal (stdlib only)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -S -m unittest tests.test_h368_pad_integrity tests.test_h367_four_row_preflight tests.test_h364_native_batch tests.test_h199_native_action_sft -q
      - name: Verify no synthetic screenshot or gold is written
        run: python -c "import subprocess; assert not subprocess.check_output(['git','status','--porcelain'],text=True)"
