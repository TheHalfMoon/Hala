# H229: strict no-npm-install read-only public npm tarball evidence.
name: H229 npm original published three tarballs four assets

on:
  push:
    branches:
      - ps/h229-published-h137-npm-tarball-byte-attestation
    paths:
      - "h229/**"
      - "tests/test_h229_published_npm_tarball_integrity.py"
      - "tests/test_h229_owner_published_four_asset_match.py"
      - ".github/workflows/h229-verified-published-public-npm-cpu.yml"
  pull_request:
    paths:
      - "h229/**"
      - "tests/test_h229_published_npm_tarball_integrity.py"
      - ".github/workflows/h229-verified-published-public-npm-cpu.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h229-public-npm-provenance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-policy:
    name: ${{ matrix.os }} Python ${{ matrix.py }} offline synthetic tarballs
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        py: ["3.11", "3.12"]
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.py }}
      - name: Check only fabricated public npm archive fixtures, no installs
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_h229_published_npm_tarball_integrity.py' -q
          python -O -m unittest discover -s tests -p 'test_h229_published_npm_tarball_integrity.py' -q
          python -m unittest discover -s tests -p 'test_h229_owner_published_four_asset_match.py' -q
          python -O -m unittest discover -s tests -p 'test_h229_owner_published_four_asset_match.py' -q
          python -m compileall -q h229 tests/test_h229_published_npm_tarball_integrity.py tests/test_h229_owner_published_four_asset_match.py
          echo "H229_SYNTHETIC_NO_NETWORK_NO_MODEL_NO_OWNER_MEDIA_PASS"

  original-published-registry:
    name: Independent real npm registry published JS/CSS byte hashes (no install)
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      GITHUB_ACTIONS: "true"
      PYTHONDONTWRITEBYTECODE: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PIP_NO_INDEX: "1"
    steps:
      - name: Checkout source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Fetch ONLY 3 pinned PUBLIC npm tarballs, validate SHA-1 and registry SHA-512 SRI, hash 4 original assets
        shell: bash
        run: |
          set -euo pipefail
          python -m h229.verified_published_npm_assets --fetch-public-registry
          echo "H229_REAL_PUBLISHED_NPM_3_TARBALLS_4_FILES_SOURCE_ONLY_NO_OWNER_DATA"
