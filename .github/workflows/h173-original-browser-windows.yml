name: H173 pristine original-browser Windows reproducibility
on:
  push:
    paths:
      - 'h173/ci_source_smoke.py'
      - 'h173/ci_native_actuator_smoke.py'
      - 'h173/capture_ood.py'
      - 'h173/browser_runtime.py'
      - 'h173/native_reward.py'
      - 'h173/stable_capture.py'
      - '.github/workflows/h173-original-browser-windows.yml'
  pull_request:
    paths:
      - 'h173/ci_source_smoke.py'
      - 'h173/ci_native_actuator_smoke.py'
      - 'h173/capture_ood.py'
      - 'h173/browser_runtime.py'
      - 'h173/native_reward.py'
      - 'h173/stable_capture.py'
      - '.github/workflows/h173-original-browser-windows.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  owner-data-free-windows-source-repro:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned browser without paid inference
        shell: pwsh
        run: |
          python -m pip install Pillow==12.3.0 playwright==1.64.1
          if ($LASTEXITCODE -ne 0) { throw 'Browser dependencies failed' }
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Chromium install failed' }
      - name: Fetch untouched pinned MIT donor repos
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'h173-upstream'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $sources = @(
            @('tingle', 'https://github.com/robinparisi/tingle.git', '9eadca70c72ef9adb9144cc23a4104978d3bc63b'),
            @('tiny-slider', 'https://github.com/ganlanyuan/tiny-slider.git', '4d709735c417c2483e77a22d017fc1b18c04f0d4')
          )
          foreach ($source in $sources) {
            $path = Join-Path $root $source[0]
            git init -q $path
            if ($LASTEXITCODE -ne 0) { throw 'Source git init failed' }
            # Windows global core.autocrlf rewrites original HTML LF -> CRLF.
            # Keep exact upstream Git blob bytes for independent SHA checks.
            git -C $path config core.autocrlf false
            git -C $path config core.eol lf
            git -C $path remote add origin $source[1]
            git -C $path fetch --depth 1 origin $source[2]
            if ($LASTEXITCODE -ne 0) { throw 'Pinned git fetch failed' }
            git -C $path checkout -q --detach FETCH_HEAD
            if ($LASTEXITCODE -ne 0) { throw 'Immutable donor checkout failed' }
            $actual = git -C $path rev-parse HEAD
            if ($actual.Trim() -ne $source[2]) { throw 'Donor Git SHA mismatch' }
            if ((git -C $path status --porcelain)) { throw 'Donor tree modified' }
          }
      - name: Run 32 original Windows-native states and exact independent RGBA replay
        shell: pwsh
        run: |
          $env:PYTHONPATH = '.'
          $root = Join-Path $env:RUNNER_TEMP 'h173-upstream'
          python -m h173.ci_source_smoke --upstream $root
          if ($LASTEXITCODE -ne 0) { throw 'H173 Windows original GUI source mismatch' }
      - name: Exercise real original Windows actuator with ephemeral local reference
        shell: pwsh
        run: |
          $env:PYTHONPATH = '.'
          $root = Join-Path $env:RUNNER_TEMP 'h173-upstream'
          python -m h173.ci_native_actuator_smoke --upstream $root
          if ($LASTEXITCODE -ne 0) { throw 'H173 original Windows click/abstain actuator failed' }
      - name: Confirm benchmark boundary
        run: echo 'SOURCE ONLY - original action/abstain checks, no user private OOD, no H164/H171 GPU, no model quality score'
