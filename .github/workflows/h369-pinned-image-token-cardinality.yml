name: H369 pinned Qwen image-token cardinality (NO TRAIN)

on:
  pull_request:
    paths:
      - h369/**
      - tests/test_h369_image_token_cardinality.py
      - h364/native_batch.py
      - h364/run_real_cpu_batch.py
      - .github/workflows/h369-pinned-image-token-cardinality.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-image-count-source-only:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - name: Preserve original source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Check invented image placeholders and native CPU token masking
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -S -m unittest tests.test_h369_image_token_cardinality tests.test_h368_pad_integrity tests.test_h367_four_row_preflight tests.test_h364_native_batch tests.test_h199_native_action_sft -q
      - name: Assert source-only runs left no artifacts
        run: python -c "import subprocess; assert not subprocess.check_output(['git','status','--porcelain'],text=True)"
