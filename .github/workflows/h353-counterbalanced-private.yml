name: H353 frozen counterbalanced original-Qwen private protocol

on:
  pull_request:
    paths:
      - h353/**
      - tests/test_h353_order_balanced_private.py
      - .github/workflows/h353-counterbalanced-private.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-frozen-protocol-no-gpu:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - name: Preserve original source bytes on Windows
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install Pillow==11.3.0
      - name: Verify immutable source, balanced order, private receipt and no GPU
        run: python -m unittest tests.test_h353_order_balanced_private tests.test_h352_private_paired_snap tests.test_h352_pixel_button_snap -q
        env:
          PYTHONDONTWRITEBYTECODE: '1'
