name: H386 finite Qwen pixel tensor and one-image vision grid (NO TRAIN)

on:
  pull_request:
    paths:
      - h216/real_qwen_processor_alignment.py
      - tests/test_h216_real_qwen_processor_alignment.py
      - tests/test_h361_original_qwen_processor.py
      - tests/test_h386_qwen_visual_finite_grid.py
      - h386/**
      - .github/workflows/h386-qwen-visual-finite-grid.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-original-qwen-image-contract:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - name: Preserve original source identity
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install only public synthetic source PIL dependency
        run: python -m pip install --only-binary=:all: Pillow==11.3.0
      - name: Prove finite screenshot tensor and valid one-frame grid
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m unittest tests.test_h386_qwen_visual_finite_grid tests.test_h216_real_qwen_processor_alignment tests.test_h361_original_qwen_processor -q
      - name: Refuse any screenshot, gold, model or optimizer artifact output
        run: python -c "import subprocess; assert not subprocess.check_output(['git','status','--porcelain'],text=True)"
