# H175: cross-platform independent proof of original interact.js behavior.
# Research only: do not admit these samples to TRAIN, DEV or OOD.
name: H175 original interact.js Windows Edge native smoke (research only)

on:
  push:
    branches:
      - ps/h175-owner-edge-interact-windows-proof-20261029
    paths:
      - ".github/workflows/h175-interact-native-windows-edge.yml"
      - "h174/interact_native_smoke.py"
  pull_request:
    paths:
      - ".github/workflows/h175-interact-native-windows-edge.yml"
      - "h174/interact_native_smoke.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-original-edge:
    name: pinned interact.js source + original drop event + independent Edge RGBA
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Checkout Hala without retaining credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Fixed Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Fixed Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Checkout immutable original donor and separately archive source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = 'a993eb8cd5cbc65f3a19e45ee24b7fedc026174f'
          $donor = Join-Path $env:RUNNER_TEMP 'h175-interact-pristine'
          $scratch = Join-Path $env:RUNNER_TEMP 'h175-interact-scratch'
          $archive = Join-Path $env:RUNNER_TEMP 'h175-interact-source.tar'
          New-Item -ItemType Directory -Path $donor, $scratch -Force | Out-Null
          git -C $donor init
          if ($LASTEXITCODE -ne 0) { throw 'git init failed' }
          # Windows defaults can rewrite upstream LF bytes to CRLF on checkout.
          # Preserve immutable Git blob bytes or the SHA-pinned HTML/license fails.
          git -C $donor config core.autocrlf false
          if ($LASTEXITCODE -ne 0) { throw 'git checkout byte-preservation config failed' }
          git -C $donor remote add origin https://github.com/taye/interact.js.git
          if ($LASTEXITCODE -ne 0) { throw 'git remote failed' }
          git -C $donor fetch --depth=1 origin $sha
          if ($LASTEXITCODE -ne 0) { throw 'original source fetch failed' }
          git -C $donor checkout --detach $sha
          if ($LASTEXITCODE -ne 0 -or (git -C $donor rev-parse HEAD).Trim() -ne $sha) {
            throw 'immutable donor git SHA mismatch'
          }
          if (git -C $donor status --porcelain --untracked-files=all) {
            throw 'original source donor unexpectedly dirty'
          }
          git -C $donor archive --format=tar -o $archive HEAD
          if ($LASTEXITCODE -ne 0) { throw 'git archive failed' }
          tar -xf $archive -C $scratch
          if ($LASTEXITCODE -ne 0) { throw 'original archive extraction failed' }
          "H175_DONOR=$donor" >> $env:GITHUB_ENV
          "H175_SCRATCH=$scratch" >> $env:GITHUB_ENV
          Write-Output 'H175_WINDOWS_ORIGINAL_IMMUTABLE_SOURCE_PASS'

      - name: Verify pinned original source assets independently of scratch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from hashlib import sha256
          from pathlib import Path
          import os
          from h174.source_candidates import CANDIDATES, verify_local_source_only
          pin = CANDIDATES["interact-dropzones"]
          donor = Path(os.environ["H175_DONOR"])
          scratch = Path(os.environ["H175_SCRATCH"])
          proof = verify_local_source_only("interact-dropzones", donor)
          if proof["source_git_sha"] != "a993eb8cd5cbc65f3a19e45ee24b7fedc026174f":
              raise SystemExit("H175 original Git SHA mismatch")
          for rel, expected in (
              (pin["html_path"], pin["html_sha256"]),
              (pin["license_path"], pin["license_sha256"]),
          ):
              for root in (donor, scratch):
                  if sha256((root / rel).read_bytes()).hexdigest() != expected:
                      raise SystemExit("H175 original asset pin mismatch: " + rel)
          for rel in (
              "yarn.lock", "vite.config.ts", "examples/dropzones/index.js",
              "examples/dropzones/index.css", "packages/@interactjs/actions/plugin.ts",
          ):
              if not (scratch / rel).is_file():
                  raise SystemExit("H175 original tracked file missing: " + rel)
          print("H175_WINDOWS_ORIGINAL_ASSETS_SHA256_PASS")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'original asset verification failed' }

      - name: Locked original dependency install and scratch-only package junctions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:H175_SCRATCH
          corepack enable
          if ($LASTEXITCODE -ne 0) { throw 'corepack enable failed' }
          corepack prepare yarn@1.22.22 --activate
          if ($LASTEXITCODE -ne 0) { throw 'pinned Yarn unavailable' }
          yarn install --frozen-lockfile --ignore-scripts --non-interactive
          if ($LASTEXITCODE -ne 0) { throw 'frozen original Yarn install failed' }
          # Windows equivalent of original bin/_link's link generation, only in
          # archived disposable SCRATCH; never rewrite the pristine donor.
          $scope = Join-Path $env:H175_SCRATCH 'node_modules\@interactjs'
          New-Item -ItemType Directory -Path $scope -Force | Out-Null
          $pkgs = Join-Path $env:H175_SCRATCH 'packages\@interactjs'
          foreach ($pkg in (Get-ChildItem $pkgs -Directory)) {
            $dest = Join-Path $scope $pkg.Name
            if (Test-Path $dest) { Remove-Item -LiteralPath $dest -Recurse -Force }
            New-Item -ItemType Junction -Path $dest -Target $pkg.FullName | Out-Null
          }
          $dev = Join-Path $scope '_dev'
          if (Test-Path $dev) { Remove-Item -LiteralPath $dev -Recurse -Force }
          New-Item -ItemType Junction -Path $dev -Target $env:H175_SCRATCH | Out-Null
          # Original immutable generator script, executed only in the scratch tree.
          node scripts/bin/add_plugin_indexes.js
          if ($LASTEXITCODE -ne 0) { throw 'original plugin index step failed' }
          if (-not (Test-Path (Join-Path $scope 'interactjs'))) {
            throw 'original package link missing'
          }
          Write-Output 'H175_WINDOWS_ORIGINAL_YARN_LOCK_AND_LINKS_PASS'

      - name: Install pinned native test tools without downloading model weights
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow==12.3.0 playwright==1.64.1
          if ($LASTEXITCODE -ne 0) { throw 'pinned native test dependency failed' }
          # Use machine-installed Microsoft Edge; do not substitute Chromium.

      - name: Build one original dropzones entry using original Vite config
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:H175_SCRATCH
          node --input-type=module -e "import { build } from './node_modules/vite/dist/node/index.js'; import { resolve } from 'node:path'; const root=process.cwd(); await build({configFile:resolve(root,'vite.config.ts'),build:{outDir:resolve(root,'.h175-derived-dropzones'),emptyOutDir:true,rollupOptions:{input:resolve(root,'examples/dropzones/index.html')}}});"
          if ($LASTEXITCODE -ne 0) { throw 'original selected Vite build failed' }
          if (-not (Test-Path '.h175-derived-dropzones\dropzones\index.html')) {
            throw 'original built HTML missing'
          }
          if (-not (Get-ChildItem '.h175-derived-dropzones' -Recurse -Filter '*.js' -File | Select-Object -First 1)) {
            throw 'original built JS missing'
          }
          if (git -C $env:H175_DONOR status --porcelain --untracked-files=all) {
            throw 'immutable donor changed during build'
          }
          Write-Output 'H175_WINDOWS_ORIGINAL_SELECTED_VITE_BUILD_PASS'

      - name: Real native Microsoft Edge drag/drop and byte-identical RGBA replay
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONPATH = $env:GITHUB_WORKSPACE
          $env:PYTHONDONTWRITEBYTECODE = '1'
          $root = Join-Path $env:H175_SCRATCH '.h175-derived-dropzones'
          $stdout = Join-Path $env:RUNNER_TEMP 'h175-edge-static.stdout'
          $stderr = Join-Path $env:RUNNER_TEMP 'h175-edge-static.stderr'
          $server = Start-Process -FilePath 'python' -ArgumentList @(
            '-m','http.server','18181','--bind','127.0.0.1',
            '--directory',$root
          ) -NoNewWindow -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              try {
                $r = Invoke-WebRequest 'http://127.0.0.1:18181/dropzones/index.html' -UseBasicParsing -TimeoutSec 5
                if ($r.StatusCode -eq 200) { $ready = $true; break }
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw 'original loopback HTTP server not ready' }
            python -u -m h174.interact_native_smoke --port 18181 --browser-channel msedge
            if ($LASTEXITCODE -ne 0) { throw 'original Edge event or RGBA replay failed' }
            Write-Output 'H175_WINDOWS_ORIGINAL_EDGE_EVENT_AND_RGBA_PASS_NO_DATASET_ADMISSION'
          } finally {
            Stop-Process -Id $server.Id -ErrorAction SilentlyContinue
          }
