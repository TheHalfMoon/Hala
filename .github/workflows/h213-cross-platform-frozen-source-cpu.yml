# H213: prove H212 candidate raster/PNG SHA bitwise reproducible across OS.
# No private data, model weights, GPU, trainer, OOD or model calls.
name: H213 cross-platform frozen research GUI SHA reproduction

on:
  push:
    branches:
      - ps/h213-cross-platform-generated-gui-lineage
    paths:
      - "h213/**"
      - "tests/test_h213_frozen_candidate_reproduction_gate.py"
      - "tests/test_h214_no_mac_ci_policy.py"
      - ".github/workflows/h213-cross-platform-frozen-source-cpu.yml"
  pull_request:
    paths:
      - "h213/**"
      - "tests/test_h213_frozen_candidate_reproduction_gate.py"
      - "tests/test_h214_no_mac_ci_policy.py"
      - ".github/workflows/h213-cross-platform-frozen-source-cpu.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h213-public-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  image-hash-repro:
    name: ${{ matrix.os }} Python ${{ matrix.python-version }} full 96 PNG+RGBA fingerprints
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python-version: ["3.11", "3.12"]
    env:
      HF_HUB_OFFLINE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install exact Pillow (no torch/model)
        shell: bash
        run: python -m pip install --disable-pip-version-check Pillow==12.3.0
      - name: Re-render every case and compare SHA-256 against frozen Windows research metadata
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_h213_frozen_candidate_reproduction_gate.py' -q
          python -m h213.frozen_candidate_reproduction_gate
          python -m unittest discover -s tests -p 'test_h214_no_mac_ci_policy.py' -q
          python -O -m unittest discover -s tests -p 'test_h213_frozen_candidate_reproduction_gate.py' -q
          python -O -m h213.frozen_candidate_reproduction_gate
          python -O -m unittest discover -s tests -p 'test_h214_no_mac_ci_policy.py' -q
          python -m compileall -q h213 tests/test_h213_frozen_candidate_reproduction_gate.py tests/test_h214_no_mac_ci_policy.py
          echo "H214_96_BITWISE_PNG_RGBA_WINDOWS_LINUX_ONLY_PASS_NO_MODEL_NO_OWNER_MEDIA"
