name: H410 source-review signature and zero-trust native click gate (CPU only)

on:
  pull_request:
    paths:
      - h410/**
      - h407/**
      - h201/**
      - h199/**
      - tests/test_h410_signed_source_review.py
      - tests/test_h407_source_reviewed_action.py
      - tests/test_h203_screenshot_bound_dispatch.py
      - .github/workflows/h410-signed-source-review.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refuse-unauthenticated-native-click:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - name: Preserve exact source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Production default empty-key hard-stop works without crypto
        run: python -B -S -m unittest discover -s tests -p test_h410_signed_source_review.py -q
      - name: Install only public Ed25519 verifier/test crypto
        run: python -m pip install cryptography==50.0.1
      - name: Assert ephemeral signature tests will actually run
        run: python -c "from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey; assert Ed25519PrivateKey"
      - name: Run real ephemeral signed source refusals and legacy browser guards
        run: |
          python -B -m unittest discover -s tests -p test_h410_signed_source_review.py -q
          python -B -m unittest discover -s tests -p test_h407_source_reviewed_action.py -q
          python -B -m unittest discover -s tests -p test_h203_screenshot_bound_dispatch.py -q
          python -B -m unittest discover -s tests -p test_h199_native_action_sft.py -q
        env:
          PYTHONDONTWRITEBYTECODE: '1'
