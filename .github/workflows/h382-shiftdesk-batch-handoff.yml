name: H382 ShiftDesk one-shot 24-source handoff (NO TRAIN)

on:
  pull_request:
    paths:
      - h285/train_only_browser_candidates.py
      - h382/**
      - tests/test_h382_shiftdesk_batch_handoff.py
      - .github/workflows/h382-shiftdesk-batch-handoff.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  atomic-candidate-api-contract:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - name: Preserve original pinned source identity
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Prove single complete handoff and original source compatibility
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -S -B -m unittest tests.test_h382_shiftdesk_batch_handoff tests.test_h285_original_train_only_browser tests.test_h381_shiftdesk_first_render -q
      - name: No model, source media, labels or artifacts created
        run: python -c "import subprocess; assert not subprocess.check_output(['git','status','--porcelain'],text=True)"
