name: H355 independent screenshot rights signature intake (CPU only)

on:
  pull_request:
    paths:
      - h355/**
      - tests/test_h355_signed_rights_intake.py
      - .github/workflows/h355-rights-signature-intake.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-training-trust-and-signature-contract:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - name: Preserve exact original-source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: CPU-only authentic signature primitives
        run: python -m pip install cryptography==50.0.1
      - name: Refuse all self-approval and preserve empty H199 TRAIN registry
        run: python -m unittest tests.test_h355_signed_rights_intake tests.test_h343_independent_rights_review_request tests.test_h199_native_action_sft -q
        env:
          PYTHONDONTWRITEBYTECODE: '1'
