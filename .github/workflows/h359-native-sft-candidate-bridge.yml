name: H359 verify original native SFT candidate parity (NO TRAINING)

on:
  pull_request:
    paths:
      - h359/**
      - tests/test_h359_native_candidate_bridge.py
      - tests/test_h384_native_review_decoded_pixel_distinctness.py
      - h384/**
      - .github/workflows/h359-native-sft-candidate-bridge.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-native-h199-source-only:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - name: Preserve pinned source identities
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install source-only browser and image validator
        run: python -m pip install playwright==1.64.1 Pillow==11.3.0
      - name: Install Chromium (Ubuntu)
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Fail if real source-browser/image validator is missing
        run: python -c "from playwright.sync_api import sync_playwright; from PIL import Image; assert callable(sync_playwright) and Image is not None"
      - name: Audit two original H199-native candidate families without TRAIN
        env:
          HALA_H359_BROWSER_QA: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest tests.test_h384_native_review_decoded_pixel_distinctness tests.test_h359_native_candidate_bridge tests.test_h199_native_action_sft -q
      - name: Ensure no candidate media or labels persisted in repository
        run: python -c "import subprocess; assert not subprocess.check_output(['git', 'status', '--porcelain'], text=True), 'generated candidate output leaked to repository'"
