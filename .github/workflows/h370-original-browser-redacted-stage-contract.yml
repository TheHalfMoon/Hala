name: H370 original-browser redacted stage diagnostics (NO TRAIN)

on:
  pull_request:
    paths:
      - h370/**
      - h319/beaconboard_dynamic_research.py
      - h337/source_miss_distance_bands.py
      - tests/test_h370_browser_failure_stage.py
      - .github/workflows/h370-original-browser-redacted-stage-contract.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy-safe-fail-closed-stage-contract:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - name: Preserve original source identity
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Verify known diagnostic stages and strict exception redaction
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -S -B -m unittest tests.test_h370_browser_failure_stage tests.test_h369_image_token_cardinality tests.test_h368_pad_integrity -q
      - name: Ensure no source, screenshots or gold were generated
        run: python -c "import subprocess; assert not subprocess.check_output(['git','status','--porcelain'],text=True)"
