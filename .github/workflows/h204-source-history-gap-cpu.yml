# H204 public synthetic history gap audit; NEVER runs owner-private CLI.
name: H204 old RGBA metadata gaps block model training

on:
  push:
    branches:
      - ps/h204-owner-metadata-history-gap-audit
    paths:
      - ".github/workflows/h204-source-history-gap-cpu.yml"
      - "h204/**"
      - "tests/test_h204_training_readiness_gap.py"
  pull_request:
    paths:
      - ".github/workflows/h204-source-history-gap-cpu.yml"
      - "h204/**"
      - "tests/test_h204_training_readiness_gap.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h204-history-gap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-no-media:
    name: Python ${{ matrix.python-version }} SHA-only history safety
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout code without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install only source metadata parser dependencies
        run: python -m pip install --disable-pip-version-check Pillow==12.3.0

      - name: H185 H198 H199 H204 normal and optimized isolated synthetic tests
        shell: bash
        run: |
          set -euo pipefail
          for mode in normal optimized; do
            args=()
            if [ "$mode" = optimized ]; then args=(-O); fi
            for case in h185_manifest_sha_only h198_source_metadata_readiness h199_native_action_sft h204_training_readiness_gap; do
              python "${args[@]}" -m unittest discover -s tests -p "test_${case}.py" -q
            done
          done
          python -m compileall -q h204 tests/test_h204_training_readiness_gap.py
          echo "H204_HOSTED_SYNTHETIC_HISTORY_GAP_DENIAL_PASS_NO_OWNER_DATA"
