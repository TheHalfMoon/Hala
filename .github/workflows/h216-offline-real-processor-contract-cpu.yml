# H216: synthetic CPU contract tests only. Real Qwen3-VL processor parity
# is an explicit owner-Windows-offline action, never CI model downloads.
name: H216 Qwen3VL real processor preflight source-only safeguards

on:
  push:
    branches:
      - ps/h216-real-offline-qwen3vl-processor-sft-parity
    paths:
      - "h216/**"
      - "tests/test_h216_real_qwen_processor_alignment.py"
      - ".github/workflows/h216-offline-real-processor-contract-cpu.yml"
  pull_request:
    paths:
      - "h216/**"
      - "tests/test_h216_real_qwen_processor_alignment.py"
      - ".github/workflows/h216-offline-real-processor-contract-cpu.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h216-no-weights-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    name: Linux ${{ matrix.python-version }} no-model synthetic safety gates
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install only Pillow to synthesize original GUI in-memory
        run: python -m pip install --disable-pip-version-check Pillow==12.3.0
      - name: Synthetic rejection checks without Qwen weights or processor
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_h216_real_qwen_processor_alignment.py' -q
          python -O -m unittest discover -s tests -p 'test_h216_real_qwen_processor_alignment.py' -q
          python -m compileall -q h216 tests/test_h216_real_qwen_processor_alignment.py
          echo "H216_FAKE_PROCESSOR_NEGATIVE_GATES_ONLY_NO_WEIGHTS_NO_OWNER_MEDIA"
