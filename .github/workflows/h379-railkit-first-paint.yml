name: H379 RailKit first-render source gate (NO TRAIN)

on:
  pull_request:
    paths:
      - h325/two_step_train_candidates.py
      - h379/**
      - tests/test_h379_railkit_first_paint.py
      - .github/workflows/h379-railkit-first-paint.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-first-render-source-contract:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - name: Preserve pinned Git source byte identity
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Verify exactly one render barrier and fail-closed source gate
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -S -B -m unittest tests.test_h379_railkit_first_paint tests.test_h325_original_two_step_train_candidates -q
      - name: Reject generated media, labels, or model outputs
        run: python -c "import subprocess; assert not subprocess.check_output(['git','status','--porcelain'],text=True)"
