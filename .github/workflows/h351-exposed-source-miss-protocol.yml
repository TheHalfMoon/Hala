name: H351 private Qwen source-miss protocol (CPU-only)

on:
  pull_request:
    paths:
      - h351/**
      - tests/test_h351_private_qwen_distance.py
      - .github/workflows/h351-exposed-source-miss-protocol.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invented-only-private-receipt-contract:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - name: Preserve original source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Verify bounded code-only source-miss protocol
        run: python -m unittest tests.test_h351_private_qwen_distance tests.test_h337_source_miss_distance_bands tests.test_h336_private_first_click_qwen -q
        env:
          PYTHONDONTWRITEBYTECODE: '1'
