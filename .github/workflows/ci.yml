name: cpu-qualification
on:
  push:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11.14', '3.12.14']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install Pillow==12.3.0 pytest==9.0.2
      - run: python -m unittest discover -s tests -v
      - run: python -m pytest -q tests -k "h16 or h170 or h171 or h172 or h173 or h174"
      - run: python -m pytest -q tests/test_h256_pre173_visual_history.py
      - run: python -m pytest -q tests/test_h257_private_visual_collision_gate.py
      - run: python -m pytest -q tests/test_h258_tall_historical_rgba.py
      - run: python -m compileall -q hala evaluation training data experiments h173 h174 h256 h257 h258
