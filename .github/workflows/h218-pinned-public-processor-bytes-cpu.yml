# H218: public offline processor-byte gates only. Fake fixtures in CI.
name: H218 immutable offline Qwen3VL processor source-byte safety

on:
  push:
    branches:
      - ps/h218-cryptographic-offline-processor-identity
    paths:
      - "h218/**"
      - "h216/real_qwen_processor_alignment.py"
      - "tests/test_h218_pinned_processor_snapshot_sha.py"
      - ".github/workflows/h218-pinned-public-processor-bytes-cpu.yml"
  pull_request:
    paths:
      - "h218/**"
      - "h216/real_qwen_processor_alignment.py"
      - "tests/test_h218_pinned_processor_snapshot_sha.py"
      - ".github/workflows/h218-pinned-public-processor-bytes-cpu.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h218-processor-synthetic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-bytes-policy:
    name: Linux Python ${{ matrix.python-version }} synthetic SHA-256 tamper denials
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run entirely offline stdlib fixture tests (no real model or processor)
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_h218_pinned_processor_snapshot_sha.py' -q
          python -O -m unittest discover -s tests -p 'test_h218_pinned_processor_snapshot_sha.py' -q
          python -m compileall -q h218 h216/real_qwen_processor_alignment.py tests/test_h218_pinned_processor_snapshot_sha.py
          echo "H218_PUBLIC_PROCESSOR_BYTES_SOURCE_ONLY_NO_MODEL_NO_MEDIA_NO_TRAINING_PASS"
