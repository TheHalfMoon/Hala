name: H358 original bilingual multi-step source candidate browser (NO MODEL)

on:
  pull_request:
    paths:
      - h358/**
      - tests/test_h358_original_noterelay_multistep.py
      - .github/workflows/h358-original-noterelay-multistep.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-browser-multistep-candidate-only:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - name: Preserve exact original bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install browser controller
        run: python -m pip install playwright==1.64.1
      - name: Install Chromium on Linux
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Verify actual browser available, not a simulated mock
        run: python -c "from playwright.sync_api import sync_playwright; assert callable(sync_playwright)"
      - name: Replay 128 original native actions and enforce H199 no-admission
        env:
          HALA_H358_BROWSER_QA: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest tests.test_h358_original_noterelay_multistep tests.test_h199_native_action_sft -q
      - name: Source-only outputs never persisted
        run: python -c "import subprocess; assert not subprocess.check_output(['git', 'status', '--porcelain'], text=True), 'unexpected persistent generated artifact'"
