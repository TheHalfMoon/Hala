# H208: mock multimodal processor + preloaded model only. No model downloads.
name: H208 multimodal pixel-to-native-action protocol safety

on:
  push:
    branches:
      - ps/h208-offline-preloaded-vlm-policy
    paths:
      - ".github/workflows/h208-preloaded-vlm-protocol-cpu.yml"
      - "h208/**"
      - "tests/test_h208_preloaded_vlm_policy.py"
  pull_request:
    paths:
      - ".github/workflows/h208-preloaded-vlm-protocol-cpu.yml"
      - "h208/**"
      - "tests/test_h208_preloaded_vlm_policy.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h208-model-protocol-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-multimodal:
    name: Python ${{ matrix.python-version }} image-token protocol mock
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}

      - name: Pillow for decoding generated synthetic PNG (no torch/weights)
        run: python -m pip install --disable-pip-version-check Pillow==12.3.0

      - name: H207/H208 synthetic multimodal and native-input fail-closed checks
        shell: bash
        run: |
          set -euo pipefail
          for mode in normal optimized; do
            args=()
            if [ "$mode" = optimized ]; then args=(-O); fi
            for case in h203_screenshot_bound_dispatch h207_screenshot_only_prediction_bridge h208_preloaded_vlm_policy; do
              python "${args[@]}" -m unittest discover -s tests -p "test_${case}.py" -q
            done
          done
          python -m compileall -q h208 tests/test_h208_preloaded_vlm_policy.py
          echo "H208_SYNTHETIC_PRELOADED_MULTIMODAL_PROTOCOL_PASS_NO_TORCH_NO_WEIGHTS_NO_MEDIA"
