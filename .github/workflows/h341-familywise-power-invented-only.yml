name: h341-familywise-power-invented-only
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  invented-only-exact-design-power:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -p test_h341_familywise_design_sensitivity.py -v
        env:
          PYTHONDONTWRITEBYTECODE: '1'
