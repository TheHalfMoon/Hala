name: h298-original-preloaded-two-stage-form
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ubuntu-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.14'
      - run: python -m pip install playwright==1.58.0 Pillow==11.3.0
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -p test_h298_preloaded_form_two_stage_policy.py -v
      - run: python -m unittest discover -s tests -p test_h298_original_form_policy_browser.py -v
        env:
          HALA_H298_BROWSER_QUALIFY: '1'
          PYTHONDONTWRITEBYTECODE: '1'
  windows-edge:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install playwright==1.58.0 Pillow==11.3.0
      - run: python -m unittest discover -s tests -p test_h298_preloaded_form_two_stage_policy.py -v
      - run: python -m unittest discover -s tests -p test_h298_original_form_policy_browser.py -v
        env:
          HALA_H298_BROWSER_QUALIFY: '1'
          HALA_H298_BROWSER_CHANNEL: 'msedge'
          PYTHONDONTWRITEBYTECODE: '1'
