name: h329-original-railkit-source-provenance
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ubuntu-source-git-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 50
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.14'
      - run: python -m unittest discover -s tests -p test_h329_railkit_source_provenance.py -v
        env:
          HALA_H329_GIT_QUALIFY: '1'
          PYTHONDONTWRITEBYTECODE: '1'
  windows-source-git-history:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 50
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_h329_railkit_source_provenance.py -v
        env:
          HALA_H329_GIT_QUALIFY: '1'
          PYTHONDONTWRITEBYTECODE: '1'
