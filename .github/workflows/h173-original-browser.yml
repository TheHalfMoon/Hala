name: H173 pristine original-browser source reproducibility
on:
  push:
    paths:
      - 'h173/ci_source_smoke.py'
      - 'h173/capture_ood.py'
      - 'h173/stable_capture.py'
      - '.github/workflows/h173-original-browser.yml'
  pull_request:
    paths:
      - 'h173/ci_source_smoke.py'
      - 'h173/capture_ood.py'
      - 'h173/stable_capture.py'
      - '.github/workflows/h173-original-browser.yml'

permissions:
  contents: read

jobs:
  original-app-reproducibility-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.14'
      - name: Install pinned CPU browser QA tools
        run: |
          python -m pip install Pillow==12.3.0 playwright==1.64.1
          python -m playwright install --with-deps chromium
      - name: Fetch exact untouched upstream MIT application sources
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/h173-original-upstreams"
          mkdir -p "$ROOT"
          for spec in "tingle|https://github.com/robinparisi/tingle.git|9eadca70c72ef9adb9144cc23a4104978d3bc63b" "tiny-slider|https://github.com/ganlanyuan/tiny-slider.git|4d709735c417c2483e77a22d017fc1b18c04f0d4"; do
            IFS='|' read -r name url sha <<< "$spec"
            git init -q "$ROOT/$name"
            git -C "$ROOT/$name" remote add origin "$url"
            git -C "$ROOT/$name" fetch --depth 1 origin "$sha"
            git -C "$ROOT/$name" checkout -q --detach FETCH_HEAD
            test "$(git -C "$ROOT/$name" rev-parse HEAD)" = "$sha"
            test -z "$(git -C "$ROOT/$name" status --porcelain)"
          done
      - name: Verify native state and 32 independent pixel replays, NO model
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m h173.ci_source_smoke --upstream "$RUNNER_TEMP/h173-original-upstreams"
      - name: Declare scope (source-only, not OOD)
        run: echo "SOURCE-ONLY original GUI reproducibility; NO owner data, no GPU, no OOD model quality result"
