name: H354 original pixel conservative click preservation

on:
  pull_request:
    paths:
      - h354/**
      - tests/test_h354_preserve_valid_clicks.py
      - .github/workflows/h354-conservative-pixel-policy.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-private-code-contract-cpu:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - name: Preserve source identity on all platforms
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install Pillow==11.3.0
      - name: Frozen source policy/receipt and original paired controls
        run: python -m unittest tests.test_h354_preserve_valid_clicks tests.test_h353_order_balanced_private tests.test_h352_private_paired_snap -q
        env:
          PYTHONDONTWRITEBYTECODE: '1'
