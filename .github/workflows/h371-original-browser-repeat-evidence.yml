name: H371 original browser bounded repeat evidence (NO TRAIN)

on:
  pull_request:
    paths:
      - h371/**
      - tests/test_h371_browser_repeats.py
      - h370/browser_failure_stage.py
      - h319/beaconboard_dynamic_research.py
      - h337/source_miss_distance_bands.py
      - .github/workflows/h371-original-browser-repeat-evidence.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-browser-cross-platform-repeat:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            browser: chromium
          - os: windows-latest
            browser: msedge
    steps:
      - name: Preserve Git source hash identity
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          # Match available latest 3.11 patch on each hosted OS.
          # Exact 3.11.14 is not provided on Windows Server 2025.
          python-version: '3.11'
      - name: Install pinned original browser test dependencies
        run: python -m pip install playwright==1.58.0 Pillow==11.3.0
      - name: Install Ubuntu Chromium only
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Verify repetition counter, redaction, and fail-closed semantics
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -S -B -m unittest tests.test_h371_browser_repeats tests.test_h370_browser_failure_stage -q
      - name: Repeat actual original offline H319 and H337 browser paths (no model)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: python -B -m h371.run_browser_repeats --browser ${{ matrix.browser }} --repeats 3
      - name: Prove no model data or screenshots were persisted
        run: python -c "import subprocess; assert not subprocess.check_output(['git','status','--porcelain'],text=True)"
