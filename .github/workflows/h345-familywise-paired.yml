name: H345 familywise paired invented-only

on:
  push:
    branches:
      - ps/h345-familywise-paired-sign-test
  pull_request:
    paths:
      - h345_familywise_gate.py
      - test_h345_familywise_gate.py
      - .github/workflows/h345-familywise-paired.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  invented-only:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Run bounded exact invented-only familywise gate
        run: python -m unittest test_h345_familywise_gate -v
        env:
          PYTHONDONTWRITEBYTECODE: '1'
