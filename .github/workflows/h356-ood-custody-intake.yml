name: H356 sealed external blind OOD custodian signed intake (CPU only)

on:
  pull_request:
    paths:
      - h356/**
      - tests/test_h356_sealed_ood_custody.py
      - .github/workflows/h356-ood-custody-intake.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-ood-metadata-only-no-score:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - name: Preserve original source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Verify stdlib-only repo tests import without crypto
        run: python -S -m unittest tests.test_h356_sealed_ood_custody -q
      - name: Install cryptographic verification (CPU)
        run: python -m pip install cryptography==50.0.1
      - name: Require real Ed25519 tests (no skips)
        run: python -c "from tests.test_h356_sealed_ood_custody import Ed25519PrivateKey; assert Ed25519PrivateKey is not None"
      - name: No independently enrolled signer and no training or OOD
        run: python -m unittest tests.test_h356_sealed_ood_custody tests.test_h355_signed_rights_intake tests.test_h343_independent_rights_review_request tests.test_h199_native_action_sft -q
        env:
          PYTHONDONTWRITEBYTECODE: '1'
