name: H375 first-paint browser readiness contract (NO TRAIN)

on:
  pull_request:
    paths:
      - h319/beaconboard_dynamic_research.py
      - h375/**
      - tests/test_h375_original_first_paint.py
      - .github/workflows/h375-first-paint-browser-readiness.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-bounded-first-paint:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - name: Preserve original byte-hash identity
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Test no retries, one bounded await, fail-closed browser scene
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -S -B -m unittest tests.test_h375_original_first_paint tests.test_h372_first_frame_diagnostics tests.test_h370_browser_failure_stage -q
      - name: Assert original tree unchanged and no media generated
        run: python -c "import subprocess; assert not subprocess.check_output(['git','status','--porcelain'],text=True)"
