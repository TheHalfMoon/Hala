# H230 no owner data: nine original public app source repo and SHA pairs.
name: H230 nine historical originals immutable repo SHA CPU

on:
  push:
    branches:
      - ps/h230-pin-four-additional-historic-original-repo-shas
    paths:
      - "h176/source_family_attribution.py"
      - "h230/**"
      - "tests/test_h176_source_family_attribution.py"
      - "tests/test_h177_public_origin_pins.py"
      - "tests/test_h230_four_additional_original_source_pairs.py"
      - ".github/workflows/h230-nine-immutable-originals-cpu.yml"
  pull_request:
    paths:
      - "h176/source_family_attribution.py"
      - "h230/**"
      - "tests/test_h176_source_family_attribution.py"
      - "tests/test_h177_public_origin_pins.py"
      - "tests/test_h230_four_additional_original_source_pairs.py"
      - ".github/workflows/h230-nine-immutable-originals-cpu.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h230-nine-originals-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  historical-repo-sha-pairing:
    name: ${{ matrix.os }} Python ${{ matrix.python }} nine source identity denials
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ["3.11", "3.12"]
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: 9 original SHA identity checks in normal and optimized mode
        shell: bash
        run: |
          set -euo pipefail
          for test in test_h176_source_family_attribution.py test_h177_public_origin_pins.py test_h230_four_additional_original_source_pairs.py; do
            python -m unittest discover -s tests -p "$test" -q
            python -O -m unittest discover -s tests -p "$test" -q
          done
          python -m compileall -q h176 h177 h230 tests/test_h230_four_additional_original_source_pairs.py
          echo "H230_ALL_NINE_ORIGINAL_REPOS_PINNED_SOURCE_ONLY_NO_OWNER_MEDIA_NO_MODEL"
