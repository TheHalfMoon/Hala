# H228: original H137 four MIT npm JS/CSS assets, read-only byte witness.
name: H228 H137 four public npm JS CSS byte integrity source-only

on:
  push:
    branches:
      - ps/h228-h137-four-asset-original-npm-byte-integrity
    paths:
      - "h228/**"
      - "tests/test_h228_h137_four_original_assets.py"
      - ".github/workflows/h228-h137-four-asset-byte-integrity-cpu.yml"
  pull_request:
    paths:
      - "h228/**"
      - "tests/test_h228_h137_four_original_assets.py"
      - ".github/workflows/h228-h137-four-asset-byte-integrity-cpu.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h228-four-vendor-assets-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-only:
    name: ${{ matrix.os }} Python ${{ matrix.py }} original CSS JS tamper denials
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        py: ["3.11", "3.12"]
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout private source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.py }}
      - name: Offline synthetic byte-integrity tests without owner runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_h228_h137_four_original_assets.py' -q
          python -O -m unittest discover -s tests -p 'test_h228_h137_four_original_assets.py' -q
          python -m compileall -q h228 tests/test_h228_h137_four_original_assets.py
          echo "H228_PUBLIC_H137_JS_AND_CSS_SOURCE_ONLY_SYNTHETIC_BYTE_TAMPER_DENIAL_PASS_NO_OWNER_MEDIA_NO_MODEL"
