# H207: a POLICY ADAPTER, never a real model accuracy or training result.
name: H207 screenshot-only policy bridge synthetic CPU safety

on:
  push:
    branches:
      - ps/h207-screenshot-only-prediction-bridge
    paths:
      - ".github/workflows/h207-screenshot-only-policy-cpu.yml"
      - "h207/**"
      - "h201/original_native_action_executor.py"
      - "tests/test_h207_screenshot_only_prediction_bridge.py"
  pull_request:
    paths:
      - ".github/workflows/h207-screenshot-only-policy-cpu.yml"
      - "h207/**"
      - "h201/original_native_action_executor.py"
      - "tests/test_h207_screenshot_only_prediction_bridge.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h207-screenshot-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cpu-synthetic:
    name: Python ${{ matrix.python-version }} bridge negative controls
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install lightweight GUI image import only
        run: python -m pip install --disable-pip-version-check Pillow==12.3.0

      - name: Normal and optimized H201-H203 and H207 synthetic safety checks
        shell: bash
        run: |
          set -euo pipefail
          for mode in normal optimized; do
            args=()
            if [ "$mode" = optimized ]; then args=(-O); fi
            for case in h201_original_native_action_executor h202_native_input_failure_guards h203_screenshot_bound_dispatch h207_screenshot_only_prediction_bridge; do
              python "${args[@]}" -m unittest discover -s tests -p "test_${case}.py" -q
            done
          done
          python -m compileall -q h207 h201 tests/test_h207_screenshot_only_prediction_bridge.py
          echo "H207_HOSTED_SYNTHETIC_POLICY_BRIDGE_PASS_NO_MODEL_NO_MEDIA_NO_GPU"
