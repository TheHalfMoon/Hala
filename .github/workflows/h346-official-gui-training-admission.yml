name: H346 original GUI training official admission
on:
  pull_request:
    paths:
      - training/preflight.py
      - training/scripts/train_adapter.py
      - tests/test_h346_official_gui_training_admission.py
      - .github/workflows/h346-official-gui-training-admission.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-gpu-admission:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.11', '3.12']
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned image fixture dependency (no GPU)
        run: python -m pip install Pillow==11.3.0
      - run: python -m unittest discover -s tests -p test_h346_official_gui_training_admission.py -v
      - run: python -m unittest tests.test_training tests.test_training_integrity tests.test_h199_native_action_sft tests.test_h82_orphan_optimizer_recovery -q
        env:
          PYTHONDONTWRITEBYTECODE: '1'
