name: H383 FieldPort exact-CDP screenshot source recovery (NO TRAIN)

on:
  pull_request:
    paths:
      - h296/fieldport_sequence_research.py
      - h383/**
      - tests/test_h383_fieldport_capture_recovery.py
      - .github/workflows/h383-fieldport-screenshot-recovery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-fieldport-screenshot-source:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - name: Preserve original source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Verify exactly one protocol-only retry and all screenshot locks
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -S -B -m unittest tests.test_h383_fieldport_capture_recovery tests.test_h322_source_capture_recovery -q
      - name: Refuse generated media, label or model artifacts
        run: python -c "import subprocess; assert not subprocess.check_output(['git','status','--porcelain'],text=True)"
