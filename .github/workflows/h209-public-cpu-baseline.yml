# Source-only public synthetic CPU tests. NEVER download weights in CI.
name: H209 public pretrained CPU visual baseline controls

on:
  push:
    branches:
      - ps/h209-real-local-cpu-vision-baseline
    paths:
      - "h209/**"
      - "tests/test_h209_public_cpu_visual_baseline.py"
      - ".github/workflows/h209-public-cpu-baseline.yml"
  pull_request:
    paths:
      - "h209/**"
      - "tests/test_h209_public_cpu_visual_baseline.py"
      - ".github/workflows/h209-public-cpu-baseline.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h209-sourceonly-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  public-synthetic-cpu:
    name: Python ${{ matrix.python-version }} no-weights synthetic source tests
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      HF_HUB_OFFLINE: "1"
    steps:
      - name: Checkout with no persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Pillow for generated PNG only
        run: python -m pip install --disable-pip-version-check Pillow==12.3.0
      - name: Run synthetic tests with no model download and no owner media
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_h209_public_cpu_visual_baseline.py' -q
          python -O -m unittest discover -s tests -p 'test_h209_public_cpu_visual_baseline.py' -q
          python -m compileall -q h209 tests/test_h209_public_cpu_visual_baseline.py
          echo "H209_SYNTHETIC_PUBLIC_RASTER_ONLY_NO_MODEL_DOWNLOAD_NO_OOD_PASS"
