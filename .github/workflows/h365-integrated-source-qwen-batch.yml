name: H365 integrated H363 source and H364 native Qwen batch (NO TRAIN)

on:
  pull_request:
    paths:
      - h357/source_candidate.py
      - h363/**
      - h364/**
      - h365/**
      - tests/test_h363_target_parity.py
      - tests/test_h364_native_batch.py
      - .github/workflows/h365-integrated-source-qwen-batch.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-source-and-label-batch-integration:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - name: Prevent line-ending changes to original source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install original-source browser only (NO model/weights)
        run: python -m pip install playwright==1.64.1
      - name: Install Chromium on Ubuntu
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Require real original browser dependency
        run: python -c "from playwright.sync_api import sync_playwright; assert callable(sync_playwright)"
      - name: Verify integrated H363 parity, original browser 64+128 actions, H364 labels
        env:
          HALA_H357_BROWSER_QA: '1'
          HALA_H358_BROWSER_QA: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest tests.test_h363_target_parity tests.test_h362_source_balance tests.test_h357_original_controlgarden_candidate tests.test_h358_original_noterelay_multistep tests.test_h364_native_batch tests.test_h199_native_action_sft -q
      - name: Refuse persistent generated screenshot or gold files
        run: python -c "import subprocess; assert not subprocess.check_output(['git', 'status', '--porcelain'], text=True), 'candidate output persisted in repo'"
