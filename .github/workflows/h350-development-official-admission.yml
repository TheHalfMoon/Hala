name: H350 historical development trainer official admission

on:
  pull_request:
    paths:
      - training/scripts/train_development.py
      - tests/test_h350_development_official_admission.py
      - .github/workflows/h350-development-official-admission.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-official-development-admission:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - name: Preserve frozen original source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned CPU-only image fixture dependency
        run: python -m pip install Pillow==11.3.0
      - name: Refuse unadmitted historical LoRA before side effects
        run: python -m unittest tests.test_h350_development_official_admission tests.test_development_training tests.test_h346_official_gui_training_admission -q
        env:
          PYTHONDONTWRITEBYTECODE: '1'
