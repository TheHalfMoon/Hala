name: h325-original-railkit-two-step-train-candidates
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-original-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.14'
      - run: python -m pip install playwright==1.58.0 Pillow==11.3.0
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -p test_h325_original_two_step_train_candidates.py -v
        env:
          HALA_H325_BROWSER_QUALIFY: '1'
          PYTHONDONTWRITEBYTECODE: '1'
  windows-original-edge:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install playwright==1.58.0 Pillow==11.3.0
      - run: python -m unittest discover -s tests -p test_h325_original_two_step_train_candidates.py -v
        env:
          HALA_H325_BROWSER_QUALIFY: '1'
          HALA_H325_BROWSER_CHANNEL: 'msedge'
          PYTHONDONTWRITEBYTECODE: '1'
