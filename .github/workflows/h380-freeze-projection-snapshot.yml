name: H380 freeze-projection snapshot binding (NO TRAIN)

on:
  pull_request:
    paths:
      - training/development_data.py
      - development/freeze.py
      - h380/**
      - tests/test_h380_frozen_projection_snapshot.py
      - tests/test_h380_frozen_manifest_snapshot.py
      - .github/workflows/h380-freeze-projection-snapshot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-frozen-training-projection:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - name: Keep frozen source identity unchanged by Git
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Reproduce and reject changed training projections after freeze verification
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -S -B -m unittest tests.test_h380_frozen_manifest_snapshot tests.test_h380_frozen_projection_snapshot tests.test_h350_development_official_admission -q
      - name: No model, media, optimizer or output files allowed
        run: python -c "import subprocess; assert not subprocess.check_output(['git','status','--porcelain'],text=True)"
