# H212: NEW original synthetic research source ONLY, never model training.
name: H212 procedural bilingual GUI candidate provenance CPU

on:
  push:
    branches:
      - ps/h212-original-synthetic-gui-candidates
    paths:
      - "h212/**"
      - "tests/test_h212_procedural_native_gui_candidates.py"
      - ".github/workflows/h212-bilingual-generated-gui-cpu.yml"
  pull_request:
    paths:
      - "h212/**"
      - "tests/test_h212_procedural_native_gui_candidates.py"
      - ".github/workflows/h212-bilingual-generated-gui-cpu.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h212-bilingual-new-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  self-authored-provenance:
    name: Python ${{ matrix.python-version }} exact PNG/RGBA candidate checks
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      HF_HUB_OFFLINE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install only Pillow for new generated pixels
        run: python -m pip install --disable-pip-version-check Pillow==12.3.0
      - name: Synthetic bilingual roster, real PIL image and provenance checks
        shell: bash
        run: |
          set -euo pipefail
          for mode in normal optimized; do
            args=()
            if [ "$mode" = optimized ]; then args=(-O); fi
            python "${args[@]}" -m unittest discover -s tests -p 'test_h212_procedural_native_gui_candidates.py' -q
          done
          python -m h212.procedural_native_gui_candidates
          python -m compileall -q h212 tests/test_h212_procedural_native_gui_candidates.py
          echo "H212_96_NEW_SELF_AUTHORED_CANDIDATES_NO_TRAINING_NO_MEDIA_NO_OOD_PASS"
