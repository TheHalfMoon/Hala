name: H349 development training verified-image snapshot

on:
  pull_request:
    paths:
      - training/development_data.py
      - tests/test_h349_dev_snapshot_pinning.py
      - .github/workflows/h349-development-image-snapshot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-original-image-snapshot:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install exact development image fixture dependency
        run: python -m pip install Pillow==11.3.0
      - name: Check original development training pixel identity and regressions
        run: python -m unittest tests.test_h349_dev_snapshot_pinning tests.test_development_training tests.test_development_adapter tests.test_development_precision tests.test_development_provider tests.test_development_runtime -q
        env:
          PYTHONDONTWRITEBYTECODE: '1'
