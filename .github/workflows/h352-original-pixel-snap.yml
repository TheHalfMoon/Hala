name: H352 pixel-only source button snap and paired model protocol

on:
  pull_request:
    paths:
      - h352/**
      - tests/test_h352_pixel_button_snap.py
      - tests/test_h352_private_paired_snap.py
      - .github/workflows/h352-original-pixel-snap.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invented-only-paired-protocol:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - name: Preserve frozen original Git bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install Pillow==11.3.0
      - name: Strict private paired source-free protocol
        run: python -m unittest tests.test_h352_pixel_button_snap tests.test_h352_private_paired_snap tests.test_h351_private_qwen_distance -q
        env:
          PYTHONDONTWRITEBYTECODE: '1'

  ubuntu-original-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install playwright==1.58.0 Pillow==11.3.0
      - run: python -m playwright install --with-deps chromium
      - name: Original source all-12 screenshot-only buttons
        run: python -m unittest tests.test_h352_pixel_button_snap -v
        env:
          HALA_H352_ORIGINAL_BROWSER: '1'
          PYTHONDONTWRITEBYTECODE: '1'

  windows-original-edge:
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - name: Preserve original source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install playwright==1.58.0 Pillow==11.3.0
      - name: Original source all-12 screenshot-only buttons
        run: python -m unittest tests.test_h352_pixel_button_snap -v
        env:
          HALA_H352_ORIGINAL_BROWSER: '1'
          PYTHONDONTWRITEBYTECODE: '1'
