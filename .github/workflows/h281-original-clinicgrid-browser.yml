name: h281-original-clinicgrid-browser
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install playwright==1.58.0 Pillow==11.3.0
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -p test_h281_clinicgrid_native_browser.py -v
        env:
          HALA_H281_BROWSER_QUALIFY: '1'
  windows-edge:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install playwright==1.58.0 Pillow==11.3.0
      - run: python -m unittest discover -s tests -p test_h281_clinicgrid_native_browser.py -v
        env:
          HALA_H281_BROWSER_QUALIFY: '1'
          HALA_H281_BROWSER_CHANNEL: 'msedge'
