name: H374 sealed OOD UTC expiry integrity (NO ADMISSION)

on:
  pull_request:
    paths:
      - h356/sealed_ood_custody.py
      - h374/**
      - tests/test_h356_sealed_ood_custody.py
      - tests/test_h374_utc_ood_custody.py
      - .github/workflows/h374-utc-sealed-ood-expiry.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-utc-expiry-no-ood-admission:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - name: Disable line-ending rewriting of source identity
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned CPU-only Ed25519 test dependency
        run: python -m pip install cryptography==50.0.1
      - name: Fail if crypto tests would silently skip
        run: python -c "from tests.test_h356_sealed_ood_custody import Ed25519PrivateKey; assert Ed25519PrivateKey is not None"
      - name: Verify UTC boundary and original H356 signing admission refusal
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m unittest tests.test_h374_utc_ood_custody tests.test_h356_sealed_ood_custody tests.test_h355_signed_rights_intake -q
      - name: Check no OOD data or keys were written
        run: python -c "import subprocess; assert not subprocess.check_output(['git','status','--porcelain'],text=True)"
