name: h279-original-relative-browser
on:
  push:
    branches:
      - ps/h279-private-relative-native-actuation
  pull_request:
    paths:
      - 'h279/**'
      - 'h262/stockroom.html'
      - 'h273/relative_native_bridge.py'
      - 'h264/screenshot_locked_research.py'
      - 'tests/test_h279_relative_browser.py'
      - '.github/workflows/h279-original-relative-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h279-relative-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-linux-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HALA_H279_BROWSER_QUALIFY: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.14'
      - name: Install public pinned first-party browser-only requirements
        run: |
          python -m pip install --disable-pip-version-check playwright==1.58.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Run five real source-owned native browser bridge tests
        run: python -m unittest discover -s tests -p 'test_h279_relative_browser.py' -v

  original-windows-edge:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      HALA_H279_BROWSER_QUALIFY: '1'
      HALA_H279_BROWSER_CHANNEL: 'msedge'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned public native GUI test requirements
        run: python -m pip install --disable-pip-version-check playwright==1.58.0 Pillow==11.3.0
      - name: Run five actual machine-installed Microsoft Edge bridge tests
        run: python -m unittest discover -s tests -p 'test_h279_relative_browser.py' -v
