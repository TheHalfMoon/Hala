name: H384 decoded-pixel identity for unadmitted native source review

on:
  pull_request:
    paths:
      - h359/native_candidate_bridge.py
      - h384/**
      - tests/test_h384_native_review_decoded_pixel_distinctness.py
      - .github/workflows/h384-source-decoded-pixel-identity.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-review-pixel-provenance:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - name: Preserve pinned original source identity
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Pin public CPU-only decoded PNG validator
        run: python -m pip install --only-binary=:all: Pillow==11.3.0
      - name: Reject PNG metadata aliases despite distinct file SHA256
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m unittest tests.test_h384_native_review_decoded_pixel_distinctness tests.test_h359_native_candidate_bridge -q
      - name: No screenshots, candidate gold or model weights written to repo
        run: python -c "import subprocess; assert not subprocess.check_output(['git','status','--porcelain'],text=True)"
