name: h339-original-signaldesk-git-custody-no-train-admission
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ubuntu-full-git-source-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.14'
      - run: python -m unittest discover -s tests -p test_h339_original_source_rights_evidence.py -v
        env:
          HALA_H339_GIT_QUALIFY: '1'
          PYTHONDONTWRITEBYTECODE: '1'
  windows-full-git-source-evidence:
    runs-on: windows-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_h339_original_source_rights_evidence.py -v
        env:
          HALA_H339_GIT_QUALIFY: '1'
          PYTHONDONTWRITEBYTECODE: '1'
