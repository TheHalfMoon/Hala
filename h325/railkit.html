<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RailKit — invented routing practice</title>
<style>
*{box-sizing:border-box}
html,body{width:960px;height:720px;overflow:hidden;margin:0}
body{font-family:Arial,Tahoma,sans-serif;background:#e8f0ed;color:#183e47}
aside{position:absolute;inset:0 auto 0 0;width:193px;background:#13414c;color:#f6f8e9;padding:29px 17px}
aside .logo{font-weight:900;font-size:31px;letter-spacing:0.5px}
aside p{margin:24px 0;font-size:14px;line-height:1.7;color:#ddf1da}
aside .status{position:absolute;bottom:28px;left:17px;font-size:12px;color:#e6cb5b}
main{position:absolute;top:0;bottom:0;left:193px;right:0;padding:29px 31px}
h1{font-size:27px;margin:0 0 8px}
p.lead{font-size:14px;margin:0 0 22px;color:#36555b}
#rack{display:grid;grid-template-columns:1fr 1fr;gap:17px}
.panel{min-height:235px;border:2px solid #28616e;background:#fff;border-radius:3px;padding:17px;box-shadow:7px 7px 0 #b5d1c6}
.panel .number{font-size:14px;font-weight:900;color:#3f656e}
.panel .label{font-size:23px;font-weight:850;margin:5px 0 18px}
.panel button,.panel input{width:100%;height:64px;font-size:19px;border-radius:2px;font-weight:850}
.panel button{background:#e9ae44;color:#183e47;border:2px solid #153e49;cursor:pointer}
.panel button:focus{outline:4px solid #317c8b;outline-offset:2px}
.panel input{padding:10px;border:4px solid #438f76;background:#f0faf1;color:#123b3c;caret-color:transparent}
.panel input:focus{outline:4px solid #e9ae44;outline-offset:2px}
body.dark{background:#1c333b;color:#f5f0d5}
body.dark aside{background:#10262f}
body.dark main{background:#1c333b}
body.dark .lead{color:#c2dddf}
body.dark .panel{background:#304a52;color:#fff;border-color:#d8bf67;box-shadow:7px 7px 0 #10262f}
body.dark .panel .number{color:#d3e2d2}
body.dark .panel button{background:#dcb158}
body.dark .panel input{background:#e7f2e0}
body[dir=rtl] aside{left:auto;right:0}
body[dir=rtl] main{left:0;right:193px}
body[dir=rtl] aside .status{left:auto;right:17px}
</style>
</head>
<body>
<aside><div class="logo">RailKit</div><p id="asideText">Synthetic connector control. Fictional codes only; no accounts or records.</p><div class="status">OFFLINE ● TRAIN CANDIDATE</div></aside>
<main><h1 id="heading">Choose a connector</h1><p class="lead" id="lead">Connect the requested route; a code field will appear after you click.</p><section id="rack"></section></main>
<script>
"use strict";
const IDS=["R-61","R-73","R-85","R-97"];
const EN=["Amber rail","Cedar rail","Marble rail","Willow rail"];
const AR=["المسار الكهرماني","المسار الأرز","المسار الرخامي","المسار الصفصافي"];
const ORDERS=[[0,1,2,3],[2,0,3,1],[1,3,0,2],[3,2,1,0]];
let prefs={lang:"en",order:0,dark:false};
let interacted=false;
const opened=new Set();
function railKitState(){
 return IDS.map(id=>{
  const input=document.querySelector('input[data-route="'+id+'"]');
  return {id,open:opened.has(id),value:input?input.value:""};
 });
}
function configureRailKit(x){
 if(interacted||!x||!["en","ar"].includes(x.lang)
    ||!Number.isInteger(x.order)||x.order<0||x.order>3
    ||typeof x.dark!=="boolean")throw Error("fictional scene refused");
 prefs={lang:x.lang,order:x.order,dark:x.dark};
 opened.clear();render();
}
function render(){
 const ar=prefs.lang==="ar";
 document.documentElement.lang=ar?"ar":"en";
 document.documentElement.dir=ar?"rtl":"ltr";
 document.body.dir=ar?"rtl":"ltr";
 document.body.className=prefs.dark?"dark":"";
 document.getElementById("asideText").textContent=ar?
  "لوحة ربط خيالية. رموز تدريبية فقط دون حسابات أو سجلات.":
  "Synthetic connector control. Fictional codes only; no accounts or records.";
 document.getElementById("heading").textContent=ar?"اختر المسار":"Choose a connector";
 document.getElementById("lead").textContent=ar?
  "اضغط زر المسار المطلوب أولاً، ثم اكتب الرمز في الحقل الجديد.":
  "Connect the requested route; a code field will appear after you click.";
 const rack=document.getElementById("rack");rack.replaceChildren();
 for(const index of ORDERS[prefs.order]){
  const id=IDS[index];
  const section=document.createElement("article");section.className="panel";section.dataset.route=id;
  const marker=document.createElement("div");marker.className="number";marker.textContent=id;
  const title=document.createElement("div");title.className="label";title.textContent=(ar?AR:EN)[index];
  const slot=document.createElement("div");slot.className="slot";
  const button=document.createElement("button");button.type="button";button.dataset.route=id;
  button.textContent=(ar?"اربط ":"Connect ")+id;
  button.addEventListener("click",()=>{
    interacted=true;opened.add(id);
    const input=document.createElement("input");
    input.type="text";input.autocomplete="off";input.spellcheck=false;
    input.maxLength=12;input.dataset.route=id;
    input.placeholder=ar?"الرمز الخيالي":"Fictional code";
    slot.replaceChildren(input);input.focus();
  },{once:true});
  slot.append(button);section.append(marker,title,slot);rack.append(section);
 }
}
Object.defineProperty(window,"configureRailKit",{value:configureRailKit,writable:false});
Object.defineProperty(window,"railKitState",{value:railKitState,writable:false});
render();
</script>
</body>
</html>
