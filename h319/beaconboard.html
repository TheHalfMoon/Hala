<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BeaconBoard — fictional offline action cards</title>
<style>
*{box-sizing:border-box}
html,body{width:960px;height:720px;margin:0;overflow:hidden}
body{font-family:Arial,Tahoma,sans-serif;background:#f4efdf;color:#292c3a}
header{height:105px;background:#322c53;color:#fff;padding:26px 36px;display:flex;align-items:center;justify-content:space-between}
.brand{font-size:32px;font-weight:900;letter-spacing:.6px}
.tiny{font-size:12px;font-weight:600;opacity:.9}
header .marker{border:2px solid #eac877;padding:11px 18px;border-radius:6px;font-weight:700}
main{margin:22px 35px}
h1{font-size:26px;margin:0 0 10px}
p{font-size:15px;line-height:1.5;margin:0 0 18px}
#cards{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:178px 178px;gap:17px}
.card{border:2px solid #45426e;border-radius:8px;padding:16px 20px;background:#fff;box-shadow:4px 4px 0 #d1bf86}
.card header{height:auto;background:none;color:#26253a;padding:0;display:block}
.name{font-size:22px;font-weight:850}
.hint{margin-top:7px;font-size:14px;color:#4a5371}
.slot{margin-top:14px}
button{width:100%;height:55px;border:0;border-radius:8px;background:#3a628c;color:#fff;font-size:17px;font-weight:800;cursor:pointer}
button:focus{outline:4px solid #e6b348;outline-offset:2px}
input{width:100%;height:55px;padding:9px 12px;border:3px solid #ba7129;border-radius:8px;background:#fffceb;color:#252744;font-size:21px;font-weight:800;caret-color:transparent}
input:focus{outline:4px solid #e6b348;outline-offset:2px}
footer{position:absolute;bottom:19px;left:35px;right:35px;font-size:12px;color:#77738c}
body.dark{background:#161b2f;color:#f3f0df}
body.dark header{background:#111229}
body.dark .card{background:#28314b;color:#f7f3e8;border-color:#8fb2b1;box-shadow:4px 4px 0 #4c456e}
body.dark .card header{color:#fff}
body.dark .hint{color:#d2e1d4}
body.dark button{background:#1d6e76}
body.dark footer{color:#b9bfd4}
</style>
</head>
<body>
<header><div><div class="brand">BeaconBoard</div><div class="tiny" id="subhead">Original synthetic workspace · no real records</div></div><div class="marker">OFFLINE / 01</div></header>
<main><h1 id="title">Open the requested station</h1><p id="instructions">Choose its action button first. A code box appears after selection.</p><section id="cards"></section></main>
<footer>HALA H319 · AUTHOR-ORIGINAL EXPOSED RESEARCH · NEVER BLIND OOD / ADMITTED TRAIN</footer>
<script>
"use strict";
const IDS=["B-11","B-22","B-33","B-44"];
const EN=["Signal","Review","Schedule","Relay"];
const AR=["الإشارة","المراجعة","الجدولة","الترحيل"];
const ORDERS=[[0,1,2,3],[3,0,1,2],[1,3,2,0]];
let settings={lang:"en",order:0,dark:false};
let interacted=false;
const opened=new Set();
function beaconBoardState(){
 return IDS.map(id=>{
  const input=document.querySelector('input[data-station="'+id+'"]');
  return {id,open:opened.has(id),value:input?input.value:""};
 });
}
function configureBeaconBoard(options){
 if(!options||!["en","ar"].includes(options.lang)
    ||!Number.isInteger(options.order)||options.order<0||options.order>2
    ||typeof options.dark!=="boolean"||interacted)throw Error("invalid original scene");
 settings={lang:options.lang,order:options.order,dark:options.dark};
 opened.clear();
 render();
}
function render(){
 const ar=settings.lang==="ar";
 document.documentElement.lang=ar?"ar":"en";
 document.documentElement.dir=ar?"rtl":"ltr";
 document.body.className=settings.dark?"dark":"";
 document.getElementById("subhead").textContent=ar?"لوحة خيالية أصلية · بلا سجلات":"Original synthetic workspace · no real records";
 document.getElementById("title").textContent=ar?"افتح المحطة المطلوبة":"Open the requested station";
 document.getElementById("instructions").textContent=ar?"اختر زر المحطة أولاً. يظهر مربع الرمز بعد الاختيار.":"Choose its action button first. A code box appears after selection.";
 const host=document.getElementById("cards");host.replaceChildren();
 for(const index of ORDERS[settings.order]){
  const id=IDS[index];
  const card=document.createElement("article");card.className="card";card.dataset.station=id;
  const heading=document.createElement("header");
  const name=document.createElement("div");name.className="name";name.textContent=id;
  const hint=document.createElement("div");hint.className="hint";hint.textContent=(ar?AR:EN)[index];
  heading.append(name,hint);
  const slot=document.createElement("div");slot.className="slot";
  const button=document.createElement("button");button.type="button";
  button.dataset.station=id;
  button.textContent=ar?"افتح "+id:"Open "+id;
  button.addEventListener("click",()=>{
   interacted=true;opened.add(id);
   const input=document.createElement("input");
   input.type="text";input.maxLength=12;input.dataset.station=id;
   input.autocomplete="off";input.spellcheck=false;
   input.placeholder=ar?"رمز خيالي":"Fictional code";
   input.addEventListener("input",()=>{interacted=true;});
   slot.replaceChildren(input);input.focus();
  },{once:true});
  slot.append(button);card.append(heading,slot);host.append(card);
 }
}
Object.defineProperty(window,"configureBeaconBoard",{value:configureBeaconBoard,writable:false});
Object.defineProperty(window,"beaconBoardState",{value:beaconBoardState,writable:false});
render();
</script>
</body>
</html>
